name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_management_system_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      TEST_DATABASE_NAME: task_management_system_db_test
      JWT_SECRET: ci-test-secret-not-used-in-production
      ACCESS_TOKEN_TTL_MIN: '15'
      REFRESH_TOKEN_TTL_DAYS: '14'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import-check
        working-directory: Backend
        run: python -c "from main import app; print('routes:', len(app.routes))"
      - name: Run integration tests
        working-directory: Backend
        run: pytest -v --cov=. --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - name: Install
        working-directory: Frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: Frontend
        run: pnpm lint || true
      - name: Build
        working-directory: Frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_WS_URL: wss://api.example.com
        run: pnpm build
