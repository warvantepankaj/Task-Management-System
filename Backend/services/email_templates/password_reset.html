<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1f2937;">
    <h2 style="color: #4f46e5;">Reset your password</h2>
    <p>We received a request to reset your Task Management System password.</p>
    <p>
      <a href="{reset_link}"
         style="display: inline-block; padding: 12px 20px; background: #4f46e5; color: #fff; text-decoration: none; border-radius: 8px;">
        Reset password
      </a>
    </p>
    <p style="color: #6b7280; font-size: 14px;">
      Or paste this link into your browser: <br />
      <a href="{reset_link}">{reset_link}</a>
    </p>
    <p style="color: #6b7280; font-size: 14px;">This link expires in {ttl_minutes} minutes.</p>
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;" />
    <p style="color: #9ca3af; font-size: 12px;">
      If you did not request a password reset, you can safely ignore this email.
    </p>
  </body>
</html>
